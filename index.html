<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="utf-8">
    <title>PixelForge Pro | Ultimate Editor</title>
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/boxicons@2.1.2/css/boxicons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css"/>
</head>
<body>
    <div class="container disable">
        <div class="header-row">
            <h2>PixelForge Pro</h2>
            <button id="theme-toggle"><i class='bx bxs-moon'></i></button>
        </div>
        
        <div class="wrapper">
            <div class="editor-panel">
                <div class="filter">
                    <label class="title">Filters & Tools</label>
                    <div class="options">
                        <button id="brightness" class="active">Brightness</button>
                        <button id="saturation">Saturation</button>
                        <button id="contrast">Contrast</button>
                        <button id="hue-rotate">Hue</button>
                        <button id="blur">Blur</button>
                        <button id="sepia">Sepia</button>
                        <button id="grayscale">Grayscale</button>
                        <button id="inversion">Inversion</button>
                        <button id="resize">Resize</button>
                        <button id="crop">Crop</button>
                    </div>
                    
                    <div class="slider">
                        <div class="filter-info">
                            <p class="name">Brightness</p>
                            <p class="value">100%</p>
                        </div>
                        <input type="range" value="100" min="0" max="200">
                    </div>

                    <div class="resize-panel">
                        <div class="filter-info"><p class="name">Presets</p></div>
                        <div class="preset-buttons">
                            <button data-w="1" data-h="1">1:1</button>
                            <button data-w="16" data-h="9">16:9</button>
                            <button data-w="9" data-h="16">9:16</button>
                            <button data-w="4" data-h="5">4:5</button>
                        </div>
                        <div class="input-group">
                            <input type="number" id="width-input" placeholder="W">
                            <input type="number" id="height-input" placeholder="H">
                        </div>
                        <div class="aspect-ratio">
                            <input type="checkbox" id="aspect-ratio-check" checked>
                            <label for="aspect-ratio-check">Lock Aspect</label>
                        </div>
                    </div>

                    <div class="crop-controls">
                        <button class="apply-crop">Apply Crop</button>
                    </div>
                </div>

                <div class="rotate">
                    <label class="title">Rotate & Flip</label>
                    <div class="options">
                        <button id="left"><i class="fa-solid fa-rotate-left"></i></button>
                        <button id="right"><i class="fa-solid fa-rotate-right"></i></button>
                        <button id="horizontal"><i class='bx bx-reflect-vertical'></i></button>
                        <button id="vertical"><i class='bx bx-reflect-horizontal' ></i></button>
                    </div>
                </div>
            </div>

            <div class="preview-img">
                <img src="image-placeholder.jpg" alt="preview-img">
                <div class="crop-box" id="cropBox">
                    <div class="handle n"></div><div class="handle s"></div>
                    <div class="handle e"></div><div class="handle w"></div>
                    <div class="handle nw"></div><div class="handle ne"></div>
                    <div class="handle sw"></div><div class="handle se"></div>
                </div>
            </div>
        </div>

        <div class="controls">
            <div class="row">
                <button id="undo-btn">Undo</button>
                <button id="redo-btn">Redo</button>
                <button class="compare-btn">Compare</button>
                <button class="reset-filter">Reset</button>
            </div>
            
            <div class="quality-box">
                <div class="filter-info"><p>Quality</p><p class="quality-value">80%</p></div>
                <input type="range" class="quality-slider" value="80" min="1" max="100">
            </div>

            <div class="row main-btns">
                <input type="file" class="file-input" accept="image/*" hidden>
                <button class="choose-img">Upload</button>
                <select class="format-select">
                    <option value="image/jpeg">JPG</option>
                    <option value="image/png">PNG</option>
                    <option value="image/webp">WebP</option>
                </select>
                <button class="save-img">Save</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
